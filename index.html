<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#0b1720">
	<title>Ziele von Yaren und Justin</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: "Segoe UI", Arial, sans-serif;
			color: #edf5f2;
			background: #0b1720;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			--muted: #9db1b5;
			--line: #294147;
			--surface: #121e22;
			--accent: #61e6f4;
			--accent-cool: #c5f36c;
			--accent-warm: #ff9b72;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 84px 24px;
			background: linear-gradient(132deg, #09131d 0%, #0c2025 38%, #14231f 68%, #191b18 100%);
		}

		body::before,
		body::after {
			position: fixed;
			z-index: 0;
			pointer-events: none;
			content: "";
		}

		body::before {
			inset: 0;
			background-image:
				linear-gradient(#61e6f410 1px, transparent 1px),
				linear-gradient(90deg, #61e6f410 1px, transparent 1px);
			background-size: 58px 58px;
			mask-image: linear-gradient(to bottom, #000 0%, #000b 48%, transparent 100%);
		}

		body::after {
			top: -235px;
			right: -180px;
			width: 560px;
			height: 560px;
			border: 1px solid #61e6f42b;
			border-radius: 50%;
			background:
				repeating-radial-gradient(circle, transparent 0 48px, #61e6f41a 49px, transparent 50px 82px),
				repeating-radial-gradient(circle, transparent 0 74px, #c5f36c16 75px, transparent 76px 124px),
				conic-gradient(from 25deg, transparent 0deg 62deg, #61e6f429 62deg 63deg, transparent 64deg 177deg, #ff9b7224 178deg 179deg, transparent 180deg 360deg);
			animation: ring-turn 80s linear infinite;
		}

		main {
			position: relative;
			z-index: 1;
			width: min(100%, 620px);
			margin: 0 auto;
		}

		header {
			margin-bottom: 30px;
			animation: rise-in 500ms ease-out both;
		}

		.eyebrow {
			display: flex;
			align-items: center;
			gap: 9px;
			margin-bottom: 14px;
			color: var(--accent);
			font-size: 11px;
			font-weight: 650;
			letter-spacing: 1.4px;
			text-transform: uppercase;
		}

		.eyebrow::before {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--accent), var(--accent-cool));
			box-shadow: 0 0 14px #61e6f455;
			content: "";
		}

		h1 {
			margin: 0 0 9px;
			font-family: "Bahnschrift", "Segoe UI Variable", "Segoe UI", sans-serif;
			font-size: 42px;
			font-weight: 650;
			line-height: 1.08;
		}

		.title-highlight {
			background: linear-gradient(95deg, var(--accent), var(--accent-cool));
			background-clip: text;
			color: transparent;
			-webkit-background-clip: text;
		}

		header p {
			margin: 0;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.5;
		}

		.todo-panel {
			position: relative;
			overflow: hidden;
			isolation: isolate;
			border: 1px solid #2b454a;
			border-radius: 12px;
			background: var(--surface);
			box-shadow: 0 24px 70px #03080c99, 0 0 38px #1bc8d40d;
			animation: rise-in 600ms 90ms ease-out both;
		}

		.todo-panel::before {
			position: absolute;
			top: 0;
			left: 12%;
			width: 76%;
			height: 1px;
			background: linear-gradient(90deg, transparent, var(--accent), var(--accent-cool), var(--accent-warm), transparent);
			content: "";
		}

		form {
			display: flex;
			gap: 10px;
			padding: 18px;
			border-bottom: 1px solid var(--line);
		}

		input[type="text"] {
			min-width: 0;
			flex: 1;
			padding: 12px 13px;
			border: 1px solid #34525a;
			border-radius: 7px;
			background: #0d171a;
			color: inherit;
			font: inherit;
			font-size: 15px;
		}

		input[type="text"]::placeholder { color: #718b91; }

		input[type="text"]:focus-visible,
		button:focus-visible,
		input[type="checkbox"]:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}

		button {
			border: 0;
			border-radius: 6px;
			font: inherit;
			cursor: pointer;
		}

		.add-button {
			padding: 0 19px;
			background: linear-gradient(110deg, var(--accent), var(--accent-cool));
			color: #102023;
			font-size: 14px;
			font-weight: 650;
			transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
		}

		.add-button:hover {
			transform: translateY(-1px);
			background: #d7ff83;
			box-shadow: 0 5px 22px #61e6f438;
		}

		.add-button:active { transform: translateY(0); }

		.task-list {
			margin: 0;
			padding: 0 16px;
			list-style: none;
		}

		.task {
			display: flex;
			min-height: 66px;
			align-items: center;
			gap: 12px;
			border-bottom: 1px solid var(--line);
			transition: background-color 160ms ease;
		}

		.task:hover { background: #61e6f40d; }

		.task:last-child { border-bottom: 0; }

		.task-checkbox {
			width: 18px;
			height: 18px;
			flex: 0 0 auto;
			margin: 0;
			accent-color: var(--accent);
			cursor: pointer;
		}

		.task-text {
			min-width: 0;
			flex: 1;
			overflow-wrap: anywhere;
			font-size: 15px;
			line-height: 1.5;
		}

		.task.is-complete .task-text {
			color: #858b7e;
			text-decoration: line-through;
			text-decoration-thickness: 1px;
			text-decoration-color: #858b7e;
		}

		.delete-button {
			flex: 0 0 auto;
			padding: 8px 4px 8px 8px;
			background: transparent;
			color: var(--muted);
			font-size: 13px;
		}

		.delete-button:hover { color: var(--accent-warm); }

		.empty-state {
			padding: 30px 16px;
			color: var(--muted);
			font-size: 14px;
			text-align: center;
		}

		.summary {
			padding: 16px 18px 17px;
		}

		.summary-labels {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			color: var(--muted);
			font-size: 13px;
		}

		.progress-track {
			height: 4px;
			margin-top: 13px;
			overflow: hidden;
			border-radius: 99px;
			background: #2b4146;
		}

		.progress-fill {
			width: 0;
			height: 100%;
			border-radius: inherit;
			background: linear-gradient(90deg, var(--accent), var(--accent-cool), var(--accent-warm));
			box-shadow: 0 0 10px #61e6f455;
			transition: width 220ms ease-out;
		}

		@keyframes rise-in {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@keyframes ring-turn {
			to { transform: rotate(360deg); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
			}
		}

		@media (max-width: 520px) {
			body { padding: 54px 16px; }
			body::after {
				top: -170px;
				right: -220px;
				width: 430px;
				height: 430px;
			}
			header { margin-bottom: 24px; }
			h1 { font-size: 36px; }
			form { gap: 8px; padding: 12px; }
			.add-button { padding: 0 13px; }
			.task-list { padding: 0 12px; }
			.summary { padding: 14px 13px 15px; }
		}
	</style>
</head>
<body>
	<main>
		<header>
			<div class="eyebrow">Dein Fokus</div>
			<h1>Ziele von <span class="title-highlight">Yaren und Justin</span></h1>
			<p>Jeder Schritt bringt dich näher ans Ziel.</p>
		</header>

		<section class="todo-panel" aria-label="Ziele und Aufgaben">
			<form id="todo-form">
				<input id="todo-input" type="text" placeholder="Ein neues Ziel hinzufügen …" aria-label="Neues Ziel" maxlength="300" required>
				<button class="add-button" type="submit">Hinzufügen</button>
			</form>
			<ul class="task-list" id="task-list" aria-live="polite"></ul>
			<div class="summary" aria-live="polite">
				<div class="summary-labels">
					<span id="open-count">0 offen</span>
					<span id="done-count">0 erledigt</span>
				</div>
				<div class="progress-track" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
					<div class="progress-fill" id="progress-fill"></div>
				</div>
			</div>
		</section>
	</main>

	<script>
		(() => {
			const storageKey = "meine-ziele-tasks";
			const form = document.getElementById("todo-form");
			const input = document.getElementById("todo-input");
			const list = document.getElementById("task-list");
			const openCount = document.getElementById("open-count");
			const doneCount = document.getElementById("done-count");
			const progressTrack = document.querySelector(".progress-track");
			const progressFill = document.getElementById("progress-fill");
			let tasks = [];

			try {
				const savedTasks = JSON.parse(localStorage.getItem(storageKey) || "[]");
				if (Array.isArray(savedTasks)) {
					tasks = savedTasks.filter(task =>
						task && typeof task.id === "string" && typeof task.text === "string" && typeof task.done === "boolean"
					);
				}
			} catch {
				tasks = [];
			}

			function saveTasks() {
				try {
					localStorage.setItem(storageKey, JSON.stringify(tasks));
				} catch {
					// The list remains usable if browser storage is unavailable.
				}
			}

			function render() {
				list.replaceChildren();

				if (tasks.length === 0) {
					const empty = document.createElement("li");
					empty.className = "empty-state";
					empty.textContent = "Noch keine Ziele. Was möchtest du erreichen?";
					list.append(empty);
				}

				for (const task of tasks) {
					const item = document.createElement("li");
					item.className = `task${task.done ? " is-complete" : ""}`;

					const checkbox = document.createElement("input");
					checkbox.className = "task-checkbox";
					checkbox.type = "checkbox";
					checkbox.checked = task.done;
					checkbox.setAttribute("aria-label", `${task.text} als erledigt markieren`);
					checkbox.addEventListener("change", () => {
						task.done = checkbox.checked;
						saveTasks();
						render();
					});

					const text = document.createElement("span");
					text.className = "task-text";
					text.textContent = task.text;

					const deleteButton = document.createElement("button");
					deleteButton.className = "delete-button";
					deleteButton.type = "button";
					deleteButton.textContent = "Entfernen";
					deleteButton.setAttribute("aria-label", `${task.text} löschen`);
					deleteButton.addEventListener("click", () => {
						tasks = tasks.filter(currentTask => currentTask.id !== task.id);
						saveTasks();
						render();
					});

					item.append(checkbox, text, deleteButton);
					list.append(item);
				}

				const completed = tasks.filter(task => task.done).length;
				openCount.textContent = `${tasks.length - completed} offen`;
				doneCount.textContent = `${completed} erledigt`;
				const progress = tasks.length === 0 ? 0 : Math.round((completed / tasks.length) * 100);
				progressFill.style.width = `${progress}%`;
				progressTrack.setAttribute("aria-valuenow", String(progress));
			}

			form.addEventListener("submit", event => {
				event.preventDefault();
				const text = input.value.trim();
				if (!text) return;

				tasks.push({ id: `${Date.now()}-${Math.random()}`, text, done: false });
				saveTasks();
				render();
				form.reset();
				input.focus();
			});

			render();
		})();
	</script>
</body>
</html>
