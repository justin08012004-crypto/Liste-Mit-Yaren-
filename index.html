<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#10120f">
	<title>Meine Ziele</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: "Segoe UI", Arial, sans-serif;
			color: #eceee8;
			background: #10120f;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			--muted: #9da397;
			--line: #30352d;
			--surface: #191c17;
			--accent: #c8f169;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 84px 24px;
			background: radial-gradient(ellipse at 50% 0%, #22271d 0%, #171a15 38%, #10120f 78%);
		}

		body::before,
		body::after {
			position: fixed;
			z-index: 0;
			pointer-events: none;
			content: "";
		}

		body::before {
			inset: 0;
			background-image:
				linear-gradient(#c8f1690a 1px, transparent 1px),
				linear-gradient(90deg, #c8f1690a 1px, transparent 1px);
			background-size: 64px 64px;
			mask-image: radial-gradient(ellipse at 50% 20%, #000 0%, transparent 76%);
		}

		body::after {
			top: -235px;
			right: -180px;
			width: 560px;
			height: 560px;
			border: 1px solid #c8f1691c;
			border-radius: 50%;
			background: repeating-radial-gradient(circle, transparent 0 48px, #c8f16912 49px, transparent 50px 82px);
		}

		main {
			position: relative;
			z-index: 1;
			width: min(100%, 620px);
			margin: 0 auto;
		}

		header { margin-bottom: 30px; }

		.eyebrow {
			display: flex;
			align-items: center;
			gap: 9px;
			margin-bottom: 14px;
			color: var(--accent);
			font-size: 11px;
			font-weight: 650;
			letter-spacing: 1.4px;
			text-transform: uppercase;
		}

		.eyebrow::before {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: var(--accent);
			content: "";
		}

		h1 {
			margin: 0 0 9px;
			font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
			font-size: 48px;
			font-weight: 500;
			line-height: 1.08;
		}

		header p {
			margin: 0;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.5;
		}

		.todo-panel {
			overflow: hidden;
			border: 1px solid #343a30;
			border-radius: 12px;
			background: var(--surface);
			box-shadow: 0 24px 70px #08090766;
		}

		form {
			display: flex;
			gap: 10px;
			padding: 18px;
			border-bottom: 1px solid var(--line);
		}

		input[type="text"] {
			min-width: 0;
			flex: 1;
			padding: 12px 13px;
			border: 1px solid #3a4035;
			border-radius: 7px;
			background: #11140f;
			color: inherit;
			font: inherit;
			font-size: 15px;
		}

		input[type="text"]::placeholder { color: #777d71; }

		input[type="text"]:focus-visible,
		button:focus-visible,
		input[type="checkbox"]:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}

		button {
			border: 0;
			border-radius: 6px;
			font: inherit;
			cursor: pointer;
		}

		.add-button {
			padding: 0 19px;
			background: var(--accent);
			color: #1a1d15;
			font-size: 14px;
			font-weight: 650;
		}

		.add-button:hover { background: #d7ff83; }

		.task-list {
			margin: 0;
			padding: 0 16px;
			list-style: none;
		}

		.task {
			display: flex;
			min-height: 66px;
			align-items: center;
			gap: 12px;
			border-bottom: 1px solid var(--line);
		}

		.task:last-child { border-bottom: 0; }

		.task-checkbox {
			width: 18px;
			height: 18px;
			flex: 0 0 auto;
			margin: 0;
			accent-color: var(--accent);
			cursor: pointer;
		}

		.task-text {
			min-width: 0;
			flex: 1;
			overflow-wrap: anywhere;
			font-size: 15px;
			line-height: 1.5;
		}

		.task.is-complete .task-text {
			color: #858b7e;
			text-decoration: line-through;
			text-decoration-thickness: 1px;
			text-decoration-color: #858b7e;
		}

		.delete-button {
			flex: 0 0 auto;
			padding: 8px 4px 8px 8px;
			background: transparent;
			color: var(--muted);
			font-size: 13px;
		}

		.delete-button:hover { color: var(--accent); }

		.empty-state {
			padding: 30px 16px;
			color: var(--muted);
			font-size: 14px;
			text-align: center;
		}

		.summary {
			padding: 16px 18px 17px;
		}

		.summary-labels {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			color: var(--muted);
			font-size: 13px;
		}

		.progress-track {
			height: 4px;
			margin-top: 13px;
			overflow: hidden;
			border-radius: 99px;
			background: #34392f;
		}

		.progress-fill {
			width: 0;
			height: 100%;
			border-radius: inherit;
			background: var(--accent);
			transition: width 180ms ease-out;
		}

		@media (max-width: 520px) {
			body { padding: 54px 16px; }
			body::after {
				top: -170px;
				right: -220px;
				width: 430px;
				height: 430px;
			}
			header { margin-bottom: 24px; }
			h1 { font-size: 40px; }
			form { gap: 8px; padding: 12px; }
			.add-button { padding: 0 13px; }
			.task-list { padding: 0 12px; }
			.summary { padding: 14px 13px 15px; }
		}
	</style>
</head>
<body>
	<main>
		<header>
			<div class="eyebrow">Dein Fokus</div>
			<h1>Meine Ziele</h1>
			<p>Jeder Schritt bringt dich näher ans Ziel.</p>
		</header>

		<section class="todo-panel" aria-label="Ziele und Aufgaben">
			<form id="todo-form">
				<input id="todo-input" type="text" placeholder="Ein neues Ziel hinzufügen …" aria-label="Neues Ziel" maxlength="300" required>
				<button class="add-button" type="submit">Hinzufügen</button>
			</form>
			<ul class="task-list" id="task-list" aria-live="polite"></ul>
			<div class="summary" aria-live="polite">
				<div class="summary-labels">
					<span id="open-count">0 offen</span>
					<span id="done-count">0 erledigt</span>
				</div>
				<div class="progress-track" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
					<div class="progress-fill" id="progress-fill"></div>
				</div>
			</div>
		</section>
	</main>

	<script>
		(() => {
			const storageKey = "meine-ziele-tasks";
			const form = document.getElementById("todo-form");
			const input = document.getElementById("todo-input");
			const list = document.getElementById("task-list");
			const openCount = document.getElementById("open-count");
			const doneCount = document.getElementById("done-count");
			const progressTrack = document.querySelector(".progress-track");
			const progressFill = document.getElementById("progress-fill");
			let tasks = [];

			try {
				const savedTasks = JSON.parse(localStorage.getItem(storageKey) || "[]");
				if (Array.isArray(savedTasks)) {
					tasks = savedTasks.filter(task =>
						task && typeof task.id === "string" && typeof task.text === "string" && typeof task.done === "boolean"
					);
				}
			} catch {
				tasks = [];
			}

			function saveTasks() {
				try {
					localStorage.setItem(storageKey, JSON.stringify(tasks));
				} catch {
					// The list remains usable if browser storage is unavailable.
				}
			}

			function render() {
				list.replaceChildren();

				if (tasks.length === 0) {
					const empty = document.createElement("li");
					empty.className = "empty-state";
					empty.textContent = "Noch keine Ziele. Was möchtest du erreichen?";
					list.append(empty);
				}

				for (const task of tasks) {
					const item = document.createElement("li");
					item.className = `task${task.done ? " is-complete" : ""}`;

					const checkbox = document.createElement("input");
					checkbox.className = "task-checkbox";
					checkbox.type = "checkbox";
					checkbox.checked = task.done;
					checkbox.setAttribute("aria-label", `${task.text} als erledigt markieren`);
					checkbox.addEventListener("change", () => {
						task.done = checkbox.checked;
						saveTasks();
						render();
					});

					const text = document.createElement("span");
					text.className = "task-text";
					text.textContent = task.text;

					const deleteButton = document.createElement("button");
					deleteButton.className = "delete-button";
					deleteButton.type = "button";
					deleteButton.textContent = "Entfernen";
					deleteButton.setAttribute("aria-label", `${task.text} löschen`);
					deleteButton.addEventListener("click", () => {
						tasks = tasks.filter(currentTask => currentTask.id !== task.id);
						saveTasks();
						render();
					});

					item.append(checkbox, text, deleteButton);
					list.append(item);
				}

				const completed = tasks.filter(task => task.done).length;
				openCount.textContent = `${tasks.length - completed} offen`;
				doneCount.textContent = `${completed} erledigt`;
				const progress = tasks.length === 0 ? 0 : Math.round((completed / tasks.length) * 100);
				progressFill.style.width = `${progress}%`;
				progressTrack.setAttribute("aria-valuenow", String(progress));
			}

			form.addEventListener("submit", event => {
				event.preventDefault();
				const text = input.value.trim();
				if (!text) return;

				tasks.push({ id: `${Date.now()}-${Math.random()}`, text, done: false });
				saveTasks();
				render();
				form.reset();
				input.focus();
			});

			render();
		})();
	</script>
</body>
</html>
